version: "3"

tasks:
  install:
    desc: download project dependencies
    cmds:
      - go mod download

  dev:start:
    desc: start local development
    env:
      APP_ENV: local
    cmds:
      - task: install
      - task: dev:infra.up
      - go tool air

  dev:infra.up:
    desc: start local dev environment
    cmds:
      - docker compose up -d --wait postgres
      - docker compose --profile dev run --rm migrate

  dev:infra.down:
    desc: stop local dev environment
    cmds:
      - docker compose --profile dev down
