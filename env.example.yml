app:
  name: "cached-products"
  env: "local"
http_server:
  addr: ":8080"
  read_timeout: 0s
  read_header_timeout: 5s
  write_timeout: 0s
  idle_timeout: 60s
  shutdown_timeout: 10s
logger:
  level: "debug"
  format: "console"
postgres:
  dsn: postgres://postgres:postgres@localhost:55433/products?sslmode=disable&connect_timeout=5
  startup_timeout: 5s
  operation_timeout: 5s
  db_pool:
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime: 30m
    conn_max_idle_time: 5m
